  <head>
    <script>
      // Suprimir notificações benignas de encerramento de WebSocket do Vite no iframe
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && (event.reason || event);
        var msg = (reason && reason.message) || String(reason || '');
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('ws:') !== -1 || msg.indexOf('wss:') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('error', function(event) {
        var msg = event && (event.message || '');
        if (msg && msg.indexOf('WebSocket') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
